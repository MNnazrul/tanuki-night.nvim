name: Wrong color
description: A token looks different from GitLab
title: "color: "
labels: [color]
body:
  - type: markdown
    attributes:
      value: |
        tanuki-night copies GitLab's syntax highlighting, so GitLab is the reference.
        A GitLab screenshot of the **same code** is the most useful thing you can add.

        Please search [existing issues](https://github.com/MNnazrul/tanuki-night.nvim/issues?q=is%3Aissue) first.
  - type: checkboxes
    attributes:
      label: Before you open this
      options:
        - label: I searched the existing issues
          required: true
        - label: I updated tanuki-night to the latest version
          required: true
        - label: A Treesitter parser is installed for this language (`:InspectTree` opens a tree)
          required: false
  - type: dropdown
    attributes:
      label: Style
      options:
        - tanuki-night (GitLab Dark)
        - tanuki-day (GitLab Light)
        - Both
    validations:
      required: true
  - type: input
    attributes:
      label: Language
      placeholder: e.g. Rust, TypeScript, Bash
    validations:
      required: true
  - type: textarea
    attributes:
      label: GitLab screenshot
      description: |
        The code as GitLab shows it (file view or merge request). A link to the file and line range helps too,
        e.g. `https://gitlab.com/group/project/-/blob/main/src/main.rs#L10-30`.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Neovim screenshot
      description: The same code in Neovim with tanuki-night or tanuki-day.
    validations:
      required: true
  - type: textarea
    attributes:
      label: ":Inspect output"
      description: Put the cursor on the wrong token and paste the output of `:Inspect`.
      render: text
    validations:
      required: true
  - type: input
    attributes:
      label: Neovim version
      description: Output of `nvim --version | head -1`
      placeholder: NVIM v0.11.4
    validations:
      required: true
